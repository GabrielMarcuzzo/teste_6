<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestão Financeira MEI - MVP</title>

  <!-- =========================================================================
       SEÇÃO 1: ESTILOS CSS (INTERFACE E RESPONSIVIDADE MOBILE-FIRST)
       ========================================================================= -->
  <style>
    /* Reset básico e variáveis de cores padronizadas */
    :root {
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --primary: #2c3e50;
      --accent: #2980b9;
      --success: #27ae60;
      --danger: #c0392b;
      --text-dark: #333333;
      --text-light: #7f8c8d;
      --border-color: #e0e0e0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-dark);
      display: flex;
      justify-content: center;
      padding: 10px;
      min-height: 100vh;
    }

    /* Container Principal: Mobile-First (Max 430px) com Centralização Desktop */
    .app-container {
      width: 100%;
      max-width: 430px;
      background-color: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin: auto 0;
    }

    header {
      text-align: center;
      border-bottom: 2px solid var(--bg-color);
      padding-bottom: 12px;
    }

    header h1 {
      font-size: 1.3rem;
      color: var(--primary);
    }

    header p {
      font-size: 0.8rem;
      color: var(--text-light);
    }

    /* Cards do Dashboard (Painel de Resumo) */
    .dashboard {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .card {
      background-color: var(--bg-color);
      padding: 12px 16px;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-left: 5px solid var(--text-light);
    }

    .card.receita { border-left-color: var(--success); }
    .card.despesa { border-left-color: var(--danger); }
    .card.saldo { border-left-color: var(--accent); }

    .card span {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-dark);
    }

    .card strong {
      font-size: 1.1rem;
    }

    /* Dinâmica de Cores do Saldo */
    .val-receita { color: var(--success); }
    .val-despesa { color: var(--danger); }
    .val-positivo { color: var(--success); }
    .val-negativo { color: var(--danger); }

    /* Formulário de Lançamento */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .form-control {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .form-control label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--primary);
    }

    .form-control input, 
    .form-control select {
      padding: 10px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
    }

    .form-control input:focus, 
    .form-control select:focus {
      border-color: var(--accent);
    }

    .btn {
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      font-size: 0.9rem;
    }

    .btn-primary {
      background-color: var(--primary);
      color: #ffffff;
    }

    .btn-primary:hover {
      background-color: #1a252f;
    }

    .btn-export {
      background-color: var(--success);
      color: #ffffff;
      width: 100%;
    }

    .btn-export:hover {
      background-color: #219150;
    }

    .btn-download-html {
      background-color: transparent;
      color: var(--accent);
      border: 1px dashed var(--accent);
      padding: 8px;
      font-size: 0.75rem;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
    }

    /* Tabela do Histórico de Lançamentos */
    .history-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .history-section h2 {
      font-size: 1rem;
      color: var(--primary);
    }

    .table-container {
      max-height: 220px;
      overflow-y: auto;
      border: 1px solid var(--border-color);
      border-radius: 8px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
      text-align: left;
    }

    th, td {
      padding: 8px 10px;
      border-bottom: 1px solid var(--border-color);
    }

    th {
      background-color: var(--bg-color);
      color: var(--primary);
      position: sticky;
      top: 0;
    }

    .btn-delete {
      background: none;
      border: none;
      color: var(--danger);
      font-weight: bold;
      cursor: pointer;
      font-size: 1rem;
    }

    /* Ajustes para Telas Desktop de Laboratório */
    @media (min-width: 768px) {
      body {
        align-items: center;
      }
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <!-- CABEÇALHO -->
    <header>
      <h1>Controle Financeiro MEI</h1>
      <p>Painel Gerencial Simplificado</p>
    </header>

    <!-- SEÇÃO 1: PAINEL DE RESUMO (DASHBOARD) -->
    <section class="dashboard">
      <div class="card receita">
        <span>Receitas Total</span>
        <strong id="total-receitas" class="val-receita">R$ 0,00</strong>
      </div>
      <div class="card despesa">
        <span>Despesas Total</span>
        <strong id="total-despesas" class="val-despesa">R$ 0,00</strong>
      </div>
      <div class="card saldo">
        <span>Saldo Líquido</span>
        <strong id="saldo-liquido">R$ 0,00</strong>
      </div>
    </section>

    <!-- SEÇÃO 2: FORMULÁRIO DE ENTRADA -->
    <form id="finance-form" class="form-group">
      <div class="form-control">
        <label for="description">Descrição</label>
        <input type="text" id="description" placeholder="Ex: Venda de produto, Conta de Luz" required>
      </div>

      <div class="form-control">
        <label for="amount">Valor (R$) <small>(Positivo = Receita | Negativo = Despesa)</small></label>
        <input type="number" step="0.01" id="amount" placeholder="Ex: 150.00 ou -50.00" required>
      </div>

      <div class="form-control">
        <label for="category">Categoria</label>
        <select id="category" required>
          <option value="Serviços Prestados">Serviços Prestados</option>
          <option value="Venda de Mercadorias">Venda de Mercadorias</option>
          <option value="Fornecedores">Fornecedores</option>
          <option value="Impostos/DAS">Impostos/DAS</option>
          <option value="Outros">Outros</option>
        </select>
      </div>

      <div class="form-control">
        <label for="date">Data do Lançamento</label>
        <input type="date" id="date" required>
      </div>

      <button type="submit" class="btn btn-primary">+ Adicionar Lançamento</button>
    </form>

    <!-- SEÇÃO 3: HISTÓRICO DE LANÇAMENTOS -->
    <section class="history-section">
      <h2>Histórico Financeiro</h2>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Data</th>
              <th>Descrição</th>
              <th>Valor</th>
              <th>Ação</th>
            </tr>
          </thead>
          <tbody id="transaction-list">
            <!-- Os itens serão inseridos dinamicamente pelo JavaScript -->
          </tbody>
        </table>
      </div>
    </section>

    <!-- SEÇÃO 4: AÇÕES E EXPORTAÇÃO -->
    <section>
      <button id="export-csv" class="btn btn-export">Exportar Relatório (CSV)</button>
      <button id="download-html-src" class="btn-download-html">📥 Baixar Código Fonte .HTML</button>
    </section>

  </div>

  <!-- =========================================================================
       SEÇÃO 2: REGRAS DE NEGÓCIO E LÓGICA JAVASCRIPT
       ========================================================================= -->
  <script>
    // --- ESTADO DA APLICAÇÃO ---
    // Inicializa a lista lendo do localStorage ou cria um array vazio
    let transactions = JSON.parse(localStorage.getItem('mei_transactions')) || [];

    // --- ELEMENTOS DO DOM ---
    const form = document.getElementById('finance-form');
    const descriptionInput = document.getElementById('description');
    const amountInput = document.getElementById('amount');
    const categoryInput = document.getElementById('category');
    const dateInput = document.getElementById('date');
    
    const totalReceitasEl = document.getElementById('total-receitas');
    const totalDespesasEl = document.getElementById('total-despesas');
    const saldoLiquidoEl = document.getElementById('saldo-liquido');
    const transactionListEl = document.getElementById('transaction-list');
    
    const exportBtn = document.getElementById('export-csv');
    const downloadHtmlBtn = document.getElementById('download-html-src');

    // --- REQUISITO: PREENCHER DATA ATUAL POR PADRÃO ---
    function setDefaultDate() {
      const today = new Date().toISOString().split('T')[0];
      dateInput.value = today;
    }

    // --- FUNÇÃO DE FORMATAÇÃO DE MOEDA (BRL) ---
    function formatCurrency(value) {
      return value.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    // --- FUNÇÃO DE FORMATAÇÃO DE DATA (DD/MM/AAAA) ---
    function formatDate(dateString) {
      const [year, month, day] = dateString.split('-');
      return `${day}/${month}/${year}`;
    }

    // --- FUNÇÃO: ATUALIZAR PAINEL DE RESUMOS (DASHBOARD) ---
    function updateDashboard() {
      const receitas = transactions
        .filter(item => item.amount > 0)
        .reduce((acc, item) => acc + item.amount, 0);

      const despesas = transactions
        .filter(item => item.amount < 0)
        .reduce((acc, item) => acc + Math.abs(item.amount), 0);

      const saldo = receitas - despesas;

      totalReceitasEl.textContent = formatCurrency(receitas);
      totalDespesasEl.textContent = formatCurrency(despesas);
      saldoLiquidoEl.textContent = formatCurrency(saldo);

      // Dinâmica de Cor do Saldo (Verde para Positivo/Zero, Vermelho para Negativo)
      if (saldo >= 0) {
        saldoLiquidoEl.className = 'val-positivo';
      } else {
        saldoLiquidoEl.className = 'val-negativo';
      }
    }

    // --- FUNÇÃO: RENDERIZAR TABELA DE HISTÓRICO ---
    function renderHistory() {
      transactionListEl.innerHTML = '';

      // Ordenar por data (mais recentes primeiro)
      const sortedTransactions = [...transactions].sort((a, b) => new Date(b.date) - new Date(a.date));

      sortedTransactions.forEach((item) => {
        const tr = document.createElement('tr');
        
        const isPositive = item.amount > 0;
        const valClass = isPositive ? 'val-receita' : 'val-despesa';

        tr.innerHTML = `
          <td>${formatDate(item.date)}</td>
          <td>${item.description} <br><small style="color: #7f8c8d">${item.category}</small></td>
          <td class="${valClass}">${formatCurrency(item.amount)}</td>
          <td>
            <button class="btn-delete" onclick="removeTransaction(${item.id})">&times;</button>
          </td>
        `;

        transactionListEl.appendChild(tr);
      });
    }

    // --- FUNÇÃO: ADICIONAR LANÇAMENTO ---
    function addTransaction(e) {
      e.preventDefault();

      const description = descriptionInput.value.trim();
      const amount = parseFloat(amountInput.value);
      const category = categoryInput.value;
      const date = dateInput.value;

      if (!description || isNaN(amount) || !date) {
        alert('Por favor, preencha todos os campos corretamente.');
        return;
      }

      const newTransaction = {
        id: Date.now(),
        description,
        amount,
        category,
        date
      };

      transactions.push(newTransaction);
      saveToLocalStorage();
      updateUI();

      // Limpar formulário mantendo a data de hoje
      descriptionInput.value = '';
      amountInput.value = '';
      categoryInput.focus();
      setDefaultDate();
    }

    // --- FUNÇÃO: REMOVER LANÇAMENTO ---
    window.removeTransaction = function(id) {
      transactions = transactions.filter(item => item.id !== id);
      saveToLocalStorage();
      updateUI();
    };

    // --- FUNÇÃO: SALVAR NO LOCALSTORAGE ---
    function saveToLocalStorage() {
      localStorage.setItem('mei_transactions', JSON.stringify(transactions));
    }

    // --- FUNÇÃO: ATUALIZAR INTERFACE ---
    function updateUI() {
      updateDashboard();
      renderHistory();
    }

    // --- FUNÇÃO: EXPORTAR PARA CSV (COMPATÍVEL COM EXCEL BRASIL) ---
    function exportToCSV() {
      if (transactions.length === 0) {
        alert('Não há dados para exportar.');
        return;
      }

      // Cabeçalho e separador ponto e vírgula (;) para Excel em português
      let csvContent = "Data;Descrição;Categoria;Valor (R$)\n";

      transactions.forEach(item => {
        const formattedVal = item.amount.toFixed(2).replace('.', ','); // Trata decimal para vírgula
        csvContent += `${formatDate(item.date)};"${item.description}";"${item.category}";${formattedVal}\n`;
      });

      // BOM (\uFEFF) para forçar codificação UTF-8 no Excel
      const blob = new Blob(["\uFEFF" + csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      
      const a = document.createElement('a');
      a.href = url;
      a.download = `Relatorio_MEI_${new Date().toISOString().split('T')[0]}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    }

    // --- FUNÇÃO UTILITÁRIA: DOWNLOAD DO PRÓPRIO CÓDIGO FONTE .HTML ---
    function downloadHTMLSource() {
      const htmlContent = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
      const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      
      const a = document.createElement('a');
      a.href = url;
      a.download = 'index.html';
      a.click();
      URL.revokeObjectURL(url);
    }

    // --- INICIALIZAÇÃO DOS EVENTOS ---
    form.addEventListener('submit', addTransaction);
    exportBtn.addEventListener('click', exportToCSV);
    downloadHtmlBtn.addEventListener('click', downloadHTMLSource);

    // Carga Inicial
    setDefaultDate();
    updateUI();
  </script>
</body>
</html>
